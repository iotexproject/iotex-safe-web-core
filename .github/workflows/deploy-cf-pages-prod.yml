name: Deploy CF Pages — prod

# Builds the Next.js static export and direct-uploads to the Cloudflare Pages
# project `safe-iotex-prod`. Avoids CF Pages' native build, which currently
# fails on this fork due to corepack/yarn auto-detection on node 16 and a stale
# ts-node-esm in postinstall on node 20+.
#
# Required repo secrets (already configured for staging — reused here):
#   CLOUDFLARE_API_TOKEN      — token with Pages:Edit on the iotex team account
#   CLOUDFLARE_ACCOUNT_ID     — `404b05ab…` (iotex team account)

on:
  push:
    branches: ["iotex"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://safe.iotex.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Node 16 — matches the local build env that's known to work.
      # Newer node breaks ts-node-esm in postinstall (Unknown file extension '.ts').
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # Disable corepack so it doesn't try to install yarn 4 over yarn 1.
      - name: Pin yarn classic via corepack
        run: |
          corepack disable 2>/dev/null || true
          npm install --global yarn@1.22.22 --silent
          yarn --version

      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: web-core-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Next.js build cache
        # Caches .next/cache so incremental Next.js builds reuse webpack work
        # for unchanged routes/modules. Cuts the build step from ~135s to ~70-90s
        # on warm runs. Key includes lockfile + sources so cache rebuilds when
        # deps or code change; restore-keys lets us fall back to an older cache
        # and incrementally update.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('src/**/*.{js,ts,tsx,css}', 'next.config.mjs', 'public/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000 --ignore-engines

      - name: Build (export to ./out)
        env:
          NEXT_PUBLIC_IS_PRODUCTION: 'true'
          NEXT_PUBLIC_SAFE_VERSION: '1.3.0'
          # WC v1 bridge intentionally unset: WalletConnect v1 was sunset
          # 2023-06-28 and Protofire's bridge (wcb.safe.protofire.io) is gone
          # (NXDOMAIN). Leaving it unset prevents the v1 SDK from opening a
          # WebSocket on page load. WC v2 (via NEXT_PUBLIC_WC_PROJECT_ID
          # → relay.walletconnect.com) handles all current wallet connections.
          NEXT_PUBLIC_WC_BRIDGE: ''
          NEXT_PUBLIC_WC_PROJECT_ID: 3b8893a8032f8b2ec0ecbc3b9594cb76
          NEXT_PUBLIC_GATEWAY_URL_STAGING: https://gateway.staging.safe.iotex.io
          NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: https://gateway.safe.iotex.io
        run: |
          yarn build
          yarn export
          du -sh out

      - name: Deploy to Cloudflare Pages (safe-iotex-prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=safe-iotex-prod --branch=iotex --commit-dirty=true
