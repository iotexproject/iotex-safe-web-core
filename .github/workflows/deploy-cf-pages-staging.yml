name: Deploy CF Pages — staging

# Builds the Next.js static export and direct-uploads to the Cloudflare Pages
# project `safe-iotex-staging`. Avoids CF Pages' native build, which currently
# fails on this fork due to corepack/yarn auto-detection on node 16 and a stale
# ts-node-esm in postinstall on node 20+.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN      — token with Pages:Edit on the iotex team account
#   CLOUDFLARE_ACCOUNT_ID     — `404b05ab…` (iotex team account)

on:
  push:
    branches: ["iotex-stg"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.safe.iotex.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Node 16 — matches the local build env that's known to work.
      # Newer node breaks ts-node-esm in postinstall (Unknown file extension '.ts').
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      # Disable corepack so it doesn't try to install yarn 4 over yarn 1.
      - name: Pin yarn classic via corepack
        run: |
          corepack disable 2>/dev/null || true
          npm install --global yarn@1.22.22 --silent
          yarn --version

      - name: Yarn cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: web-core-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 600000 --ignore-engines

      - name: Build (export to ./out)
        env:
          NEXT_PUBLIC_IS_PRODUCTION: 'true'
          NEXT_PUBLIC_SAFE_VERSION: '1.3.0'
          NEXT_PUBLIC_WC_BRIDGE: https://wcb.safe.protofire.io
          NEXT_PUBLIC_WC_PROJECT_ID: 3b8893a8032f8b2ec0ecbc3b9594cb76
          NEXT_PUBLIC_GATEWAY_URL_STAGING: https://gateway.staging.safe.iotex.io
          NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: https://gateway.staging.safe.iotex.io
        run: |
          yarn build
          yarn export
          du -sh out

      - name: Deploy to Cloudflare Pages (safe-iotex-staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sanity-check the token is wired through and has Pages scope.
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('token verify:', d.get('success'), d.get('result',{}).get('status'))"
          # Direct-upload the static export.
          npx -y wrangler@3.90.0 pages deploy out \
            --project-name=safe-iotex-staging \
            --branch=iotex-stg \
            --commit-dirty=true
